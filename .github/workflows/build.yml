name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  debug:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-35"
          # build.gradle требует cmake 3.10.2, но этот пакет удалён из репозитория SDK.
          # AGP определяет версию по имени папки — подкладываем совместимую 3.22.1 под именем 3.10.2.
          cp -r "$ANDROID_HOME/cmake/3.22.1" "$ANDROID_HOME/cmake/3.10.2"
          ls "$ANDROID_HOME/cmake"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: configram-afat-debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-35"
          cp -r "$ANDROID_HOME/cmake/3.22.1" "$ANDROID_HOME/cmake/3.10.2"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          TAG=${GITHUB_REF_NAME:-$VERSION}
          mkdir -p out
          cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk "out/configram-${TAG}-v${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: configram-afat-release
          path: out/*.apk

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
